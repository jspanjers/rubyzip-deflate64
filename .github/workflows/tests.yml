name: Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # TODO ubuntu-26.04/ubuntu-latest
        os: [ubuntu-24.04]
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4', '4.0', head, jruby, jruby-head, truffleruby, truffleruby-head]
        # include:
          # TODO MacOS/Windows builds.
          #- { os: macos-15, ruby: '3.0' }
          #- { os: macos-latest, ruby: '3.3' }
          #- { os: windows-2022, ruby: '3.0' }
          #- { os: windows-2025, ruby: '3.3' }
          #- { os: windows-2025, ruby: '4.0' }
          # Windows head builds.
          #- { os: windows-latest, ruby: ucrt  }
          #- { os: windows-latest, ruby: mswin }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ endsWith(matrix.ruby, 'head') || startsWith(matrix.os, 'windows') }}
    steps:
    - name: Checkout rubyzip-deflate64 code
      uses: actions/checkout@v5

    - name: Install and set up ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        rubygems: latest
        bundler-cache: true

    - name: Install inflatelib library on Ubuntu
      if: startsWith(matrix.os, 'ubuntu')
      run: |
          sudo add-apt-repository ppa:jspanjers/inflatelib -y
          sudo apt-get update
          sudo apt-get install -y libinflatelib0

    - name: Install inflatelib library on MacOS
      if: startsWith(matrix.os, 'macos')
      run: # TODO: put installation commands here.

    - name: Install inflatelib library on Windows
      if: startsWith(matrix.os, 'windows')
      run: # TODO: put correct installation commands here.
      # run: |
      #     Invoke-WebRequest `
      #       -Uri https://github.com/philr/bzip2-windows/releases/download/v1.0.8.0/bzip2-dll-1.0.8.0-win-x64.zip `
      #       -OutFile bzip2.zip `
      #       -MaximumRetryCount 10 `
      #       -RetryIntervalSec 2
      #     $RubyBinPath = Split-Path (Get-Command ${{ startsWith(matrix.ruby, 'jruby') && 'j' || '' }}ruby.exe).Path
      #     Write-Host $RubyBinPath
      #     Expand-Archive -Path bzip2.zip -DestinationPath $RubyBinPath -Force
      #     Get-Command bzip2.exe | Format-List

    - name: Run the tests
      env:
        RUBYOPT: -v
        JRUBY_OPTS: --debug
      run: bundle exec rake

    - name: Coveralls
      if: startsWith(matrix.os, 'ubuntu') && !endsWith(matrix.ruby, 'head')
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: ${{ matrix.ruby }}
        parallel: true

  finish:
    needs: test
    # TODO ubuntu-26.04/ubuntu-latest
    runs-on: ubuntu-24.04
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
